[package]
name = "rs-cpuinfo4wasm"
version = "0.1.0"
edition = "2024"

description = "CPU info functions for wasm"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-cpuinfo4wasm"
homepage = "https://github.com/takanoriyanagitani/rs-cpuinfo4wasm"
documentation = "https://docs.rs/rs-cpuinfo4wasm/latest"
keywords = ["wasm", "sysinfo", "cpu", "imports"]

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[[bin]]
name = "basic_cpuinfo"

[dependencies.wasmtime]
version = "48"
default-features = false
features = [
  "wat",
  "runtime",
  "cranelift",
]

[dependencies.sysinfo]
version = "0.39.6"
default-features = false
features = [
  "system",
]
