[package]
name = "rs-cpuinfo4wasm"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[[bin]]
name = "basic_cpuinfo"

[dependencies.wasmtime]
version = "46"
default-features = false
features = [
  "wat",
  "runtime",
  "cranelift",
]

[dependencies.sysinfo]
version = "0.39.6"
default-features = false
features = [
  "system",
]
